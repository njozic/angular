<main class="main">
  <h1>Willkommen bei meinem Angular-Kurs!</h1>
  <p>Das Projekt heißt: {{ title() }}</p>
  <button class="btn btn-secondary" (click)="changeTitle()">Klick mich!</button>

<div class="container mt-3">
  <button class="btn btn-primary" (click)="increaseCount()">count erhöhen</button>
  <button class="btn btn-danger" (click)="decreaseCount()">count veringern</button>
  <button class="btn btn-success" (click)="resetCount()">Reset count</button>
  @if( count() >= 10){
    <p class="alert alert-success">Glückwunsch du hast 10 erreicht!</p>
  }
  <p class="mt-3 alert alert-info">Count: {{count()}}</p>

  <ul class="list-group">
    @for (todo of todoList(); track todo) {
      <li class="list-group-item">{{todo}}</li>
    }
  </ul>
</div>




</main>

<router-outlet />
