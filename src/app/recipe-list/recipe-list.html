
    <div class="d-flex gap-3 justify-content-center w-100">
        <input [ngModel]="searchTerm()" (ngModelChange)="updateSearch($event)" type="text" class="form-control">
    </div>
    @if(searchTerm() !== ''){
        <div class="d-flex flex-column justify-content-center align-items-center w-100 gap-3">
            <p class="h5 mt-3">Deine Suche: </p>
            <p>{{searchTerm()}}</p>
        </div>
    }

    <div class="d-flex gap-3 justify-content-center w-100  mt-3">
        @if(filteredRecipes().length === 0){
            <div class="alert alert-warning" role="alert">
                No recipes found!
            </div>
        }

        @for(recipe of filteredRecipes(); track recipe){
            <button [routerLink]="['/recipes', recipe.id]" class="btn btn-outline-secondary">{{recipe.name}}</button>
        }
    </div>
    <hr/>
